# Railway / Nixpacks build for Laravel + Vite (PHP 8.4 from composer.json)
[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.install]
cmds = ["...", "npm ci"]

[phases.build]
cmds = [
    "...",
    "npm run build",
    "mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache",
    "chmod -R ug+rwx storage bootstrap/cache",
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
